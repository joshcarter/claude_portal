services:
  claude-usage-poller:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${LISTEN_PORT:-7654}:${LISTEN_PORT:-7654}"
    volumes:
      - poller-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7654/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  poller-data:
